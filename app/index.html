<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ATV Remote</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/remote.css">
    <script src="node_modules/jquery/dist/jquery.min.js" defer></script>
    <script src="state.js" defer></script>
    <script src="device.js" defer></script>
    <script src="views.js" defer></script>
    <script src="events.js" defer></script>
    <script src="web_remote.js" defer></script>
</head>
<body>
    <main class="remote-shell" aria-label="ATV Remote">
        <div class="drag-grip" title="Drag to move the remote" aria-hidden="true"><span></span></div>

        <section id="setupScreen" class="pair-screen" aria-labelledby="setupTitle">
            <h1 id="setupTitle">ATV Remote</h1>
            <p id="statusText" role="status">Starting ATV Remote…</p>
            <div id="addNewElements" hidden>
                <div id="results" hidden>
                    <label for="atv_picker">Apple TV</label>
                    <select id="atv_picker"></select>
                </div>
                <div id="pairCodeElements" hidden>
                    <label for="pairCode">Enter the PIN shown on your TV.</label>
                    <input id="pairCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" />
                    <button id="pairButton" class="setup-button primary" type="button">Pair</button>
                </div>
                <button id="scanAgain" class="setup-button" type="button" hidden>Scan again</button>
                <button id="cancelPairing" class="setup-button" type="button" hidden>Cancel</button>
            </div>
        </section>

        <section id="runningElements" class="remote-controls" aria-label="Apple TV controls" hidden>
            <div class="device-picker">
                <span class="device-icon" aria-hidden="true"></span>
                <select id="remoteDropdown" aria-label="Paired Apple TV"></select>
            </div>
            <div class="touch-surface" role="group" aria-label="Directional pad">
                <button class="touch-key touch-up" data-key="up" type="button" aria-label="Up" title="Up (↑)">
                    <i class="fas fa-chevron-up" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">↑</span>
                </button>
                <button class="touch-key touch-left" data-key="left" type="button" aria-label="Left" title="Left (←)">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">←</span>
                </button>
                <button class="touch-key touch-select" data-key="select" type="button" aria-label="Select" title="Select (Return)">
                    <span class="select-label" aria-hidden="true">Select</span><span class="shortcut" aria-hidden="true">↵</span>
                </button>
                <button class="touch-key touch-right" data-key="right" type="button" aria-label="Right" title="Right (→)">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">→</span>
                </button>
                <button class="touch-key touch-down" data-key="down" type="button" aria-label="Down" title="Down (↓)">
                    <i class="fas fa-chevron-down" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">↓</span>
                </button>
            </div>

            <div class="control-dock">
                <div class="button-deck" role="group" aria-label="Playback and volume">
                    <button class="round-key menu-key" data-key="menu" type="button" aria-label="Menu" title="Menu (Esc or Delete)">
                        <span class="key-label" aria-hidden="true">Menu</span><span class="shortcut" aria-hidden="true">Esc</span>
                    </button>
                    <button class="round-key" data-key="home" type="button" aria-label="TV" title="TV (T). Hold for Control Center (L).">
                        <i class="fas fa-tv" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">T/L</span>
                    </button>
                    <button class="round-key keyboard-key" id="topTextKBLink" type="button" aria-label="Open keyboard" title="Open keyboard (K)">
                        <i class="fas fa-keyboard" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">K</span>
                    </button>
                    <div class="volume-rocker" role="group" aria-label="Volume">
                        <button data-key="volume_up" type="button" aria-label="Volume up" title="Volume up (+)">
                            <span class="volume-mark" aria-hidden="true">+</span><span class="shortcut" aria-hidden="true">+</span>
                        </button>
                        <button data-key="volume_down" type="button" aria-label="Volume down" title="Volume down (−)">
                            <span class="volume-mark" aria-hidden="true">−</span><span class="shortcut" aria-hidden="true">−</span>
                        </button>
                    </div>
                    <button class="round-key play-key" data-key="play_pause" type="button" aria-label="Play or pause" title="Play or pause (Space)">
                        <span class="play-mark" aria-hidden="true"><i class="fas fa-play"></i><i class="fas fa-pause"></i></span>
                        <span class="shortcut" aria-hidden="true">Space</span>
                    </button>
                </div>

                <div class="seek-keys" role="group" aria-label="Skip playback">
                    <button data-key="skip_backward" type="button" aria-label="Skip backward" title="Skip backward ([)">
                        <i class="fas fa-step-backward" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">[</span>
                    </button>
                    <button data-key="skip_forward" type="button" aria-label="Skip forward" title="Skip forward (])">
                        <i class="fas fa-step-forward" aria-hidden="true"></i><span class="shortcut" aria-hidden="true">]</span>
                    </button>
                </div>

                <p id="cmdFade" class="command-feedback" aria-hidden="true"></p>
            </div>
        </section>
    </main>
</body>
</html>
