<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Hotkey</title>
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/select2/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="css/pure-min.css">
    <link href="node_modules/select2/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body {
            min-width: 340px;
        }
        .hotkeys-container {
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .hotkeys-multiple {
            width: 100%;
            min-width: 300px;
            height: 200px;
        }
        #parsed-hotkeys, #all-parsed-hotkeys {
            width: 100%;
            min-width: 300px;
            padding: 10px;
            box-sizing: border-box;
        }
        .select2-container {
            width: 100% !important;
        }
        label {
            display: block;
            margin-bottom: 10px;
            margin-top: 10px;
            font-weight: bold;
        }
        .info {
            font-style: italic;
            margin: 10px;
        }
        #buttons {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="pure-g">
        <div class="pure-u-1-1">
       
            <div class="hotkeys-container">
                <label for="hotkeys">Hotkey</label>
                <select id="hotkeys" class="hotkeys-multiple" name="keys[]" multiple="multiple">
                </select>
                <label for="parsed-hotkeys">Current Hotkey Value</label>
                <input type="text" disabled id="parsed-hotkeys" name="parsed-hotkeys" readonly>
                <label for="all_hotkeys">All Hotkeys</label>
                <select id="all_hotkeys" class="hotkeys-multiple" name="allkeys[]" multiple="multiple"></select>
                <label for="all-parsed-hotkeys">All Hotkeys Value</label>
                <input type="text" disabled id="all-parsed-hotkeys" name="all-parsed-hotkeys" readonly>
                <div id="buttons">
                    <button class="pure-button" id="addHotkeys">Add</button>
                    <button class="pure-button" id="saveHotkey">Save</button>
                    <button class="pure-button" id="cancelHotkey">Cancel</button>
                </div>
            </div>
            <div class="info">

                The default shortcut is <kbd id="defaultHotkey"></kbd>.
            </div>
            </div>
    </div>
    <script src="hotkey.js"></script>
</body>
</html>
