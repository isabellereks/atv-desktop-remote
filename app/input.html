<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search field input</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pure-min.css">
    <link rel="stylesheet" href="css/all.css">
</head>

<body>
    <div class="large-text-input-wrapper green">
        <input type="text" id="textInput" class="large-text-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Enter text for search field">
    </div>
    <p class="info-text-italics">This will only work if a search field is active on the connected Apple TV.</p>
    <p class="info-text">🟢 = connected device is accepting text input</p>
    <p class="info-text"><span style="opacity: 0.5">⚪️</span> = connected device does not appear to be accepting text input</p>

    <script src="input.js"></script>
</body>
</html>
